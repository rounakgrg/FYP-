databases:
  - name: municipal_db
    databaseName: municipal_db
    user: municipal_user

services:
  - type: web
    name: municipal-project
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn municipal_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: municipal_db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
