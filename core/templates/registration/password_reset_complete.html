{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-5 text-center">
                    <i class="bi bi-check-circle-fill display-4 text-success mb-3"></i>
                    <h3 class="mb-3">Password Reset Complete</h3>
                    <p class="lead">Your password has been set. You may go ahead and log in now.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary mt-3">Log in</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
