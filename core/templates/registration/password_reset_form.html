{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-envelope display-4 text-primary"></i>
                        <h3 class="mt-3">Reset Password</h3>
                        <p class="text-muted">Enter your email address to receive a password reset link.</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label" for="id_email">Email address:</label>
                            <input type="email" name="email" id="id_email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Reset Email</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
