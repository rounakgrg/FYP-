{% extends 'core/base.html' %}

{% block content %}
<div class="theme-super-admin">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <h4 class="mb-4 text-danger fw-bold"><i class="bi bi-file-earmark-plus me-2"></i> {{ title }}
                        </h4>

                        <form method="post">
                            {% csrf_token %}
                            {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.help_text %}
                                <div class="form-text text-muted small">{{ field.help_text }}</div>
                                {% endif %}
                                {{ field.errors }}
                            </div>
                            {% endfor %}

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-danger px-4">Save Service</button>
                                <a href="{% url 'admin_services' %}" class="btn btn-light">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.body.classList.add('theme-super-admin');
</script>
{% endblock %}
