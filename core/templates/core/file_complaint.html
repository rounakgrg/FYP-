{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden mb-5">
                <div class="card-header bg-primary text-white border-bottom-0 py-4 px-4 px-md-5">
                    <div class="d-flex align-items-center">
                        <div class="bg-white bg-opacity-25 rounded-circle d-inline-flex p-3 me-3">
                            <i class="bi bi-pencil-square fs-3 text-white"></i>
                        </div>
                        <h3 class="mb-0 fw-bold tracking-tight">File a Complaint</h3>
                    </div>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Complaint Title</label>
                            <input type="text" name="title" class="form-control form-control-lg bg-light border-0" required
                                placeholder="e.g. Broken Streetlight on Main St">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Location</label>
                            <input type="text" id="id_location" name="location" class="form-control form-control-lg bg-light border-0 mb-2"
                                placeholder="Select a location on the map or use the search icon..." readonly>
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-info-circle text-secondary me-2"></i>
                                <small class="text-secondary mb-0">Click on the map to pin a location, or use the search icon on the right side of the map.</small>
                            </div>
                            <div class="position-relative">
                                <div id="map" style="height: 350px; width: 100%; z-index: 1;" class="rounded-4 border-0 shadow-sm">
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Attach Image <span class="text-secondary fw-normal">(Optional)</span></label>
                            <input type="file" id="id_image" name="image" class="form-control form-control-lg bg-light border-0" accept="image/*">
                            <div class="mt-4 d-none text-center bg-light rounded-4 p-3 border border-1 border-light" id="imagePreviewContainer">
                                <img id="imagePreview" src="#" alt="Image Preview" class="img-fluid rounded-3 shadow-sm"
                                    style="max-height: 300px; object-fit: contain;">
                                <div class="mt-3">
                                    <button type="button" class="btn btn-sm btn-outline-danger rounded-pill px-4 fw-medium"
                                        onclick="document.getElementById('id_image').value=''; document.getElementById('imagePreviewContainer').classList.add('d-none');">
                                        <i class="bi bi-trash me-1"></i> Remove Image
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Department</label>
                            <select name="department" class="form-select form-select-lg bg-light border-0">
                                <option value="">Select Department (Optional)</option>
                                {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-semibold text-dark">Description</label>
                            <textarea name="description" class="form-control form-control-lg bg-light border-0" rows="5" required
                                placeholder="Detailed description of the issue..."></textarea>
                        </div>

                        <div class="d-grid mt-2">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm fw-medium py-3 fs-5">
                                <i class="bi bi-send-fill me-2"></i> Submit Complaint
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<!-- Leaflet Control Geocoder CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- Leaflet Control Geocoder JS -->
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const defaultLocation = [27.7172, 85.3240]; // Kathmandu, Nepal
        const map = L.map('map').setView(defaultLocation, 13);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let currentMarker = null;
        const locationInput = document.getElementById('id_location');

        // Add Geocoder control (Search box)
        const geocoder = L.Control.geocoder({
            defaultMarkGeocode: false
        })
            .on('markgeocode', function (e) {
                const bbox = e.geocode.bbox;
                const poly = L.polygon([
                    bbox.getSouthEast(),
                    bbox.getNorthEast(),
                    bbox.getNorthWest(),
                    bbox.getSouthWest()
                ]);
                map.fitBounds(poly.getBounds());

                updateMarker(e.geocode.center, e.geocode.name);
            })
            .addTo(map);

        // Map click event
        map.on('click', function (e) {
            const latlng = e.latlng;

            // Reverse geocoding (convert coordinates to address) using Nominatim
            fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latlng.lat}&lon=${latlng.lng}`)
                .then(response => response.json())
                .then(data => {
                    let address = data.display_name;
                    if (!address) {
                        address = `${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`;
                    }
                    updateMarker(latlng, address);
                })
                .catch(error => {
                    console.error("Reverse geocoding failed:", error);
                    updateMarker(latlng, `${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`);
                });
        });

        function updateMarker(latlng, locationName) {
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            currentMarker = L.marker(latlng).addTo(map);
            currentMarker.bindPopup(locationName).openPopup();

            // Update the hidden/readonly input field with the location text
            locationInput.value = locationName;
        }

        // Image preview functionality
        const imageInput = document.getElementById('id_image');
        const previewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');

        if (imageInput) {
            imageInput.addEventListener('change', function () {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        imagePreview.src = e.target.result;
                        previewContainer.classList.remove('d-none');
                    }
                    reader.readAsDataURL(file);
                } else {
                    imagePreview.src = '#';
                    previewContainer.classList.add('d-none');
                }
            });
        }
    });
</script>
{% endblock %}
