{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                            <i class="bi bi-person-fill display-4 text-primary"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Welcome Back</h3>
                        <p class="text-secondary">Login to manage complaints</p>
                    </div>

                    <form method="post" id="loginForm">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Username or Email</label>
                            <input type="text" name="username" id="id_username" class="form-control form-control-lg bg-light border-0" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Password</label>
                            <input type="password" name="password" id="id_password" class="form-control form-control-lg bg-light border-0" required>
                        </div>
                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm fw-medium">Log In</button>
                        </div>
                    </form>

                    <div class="text-center mb-4">
                        <p class="text-secondary mb-1">Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none fw-semibold">Register here</a></p>
                        <p class="mb-0"><a href="{% url 'password_reset' %}" class="text-secondary text-decoration-none hover-primary transition-colors">Forgot your password?</a></p>
                    </div>

                    <hr class="border-light border-opacity-50">

                    <div class="mt-4 pt-2">
                        <h5 class="text-center mb-3 text-muted">Demo Quick Login</h5>
                        <div class="d-grid gap-2">
                            <button onclick="fillLogin('citizen', 'password')"
                                class="btn btn-outline-info text-dark text-start">
                                <i class="bi bi-person me-2"></i> <strong>Citizen</strong> (Normal User)
                            </button>
                            <button onclick="fillLogin('section_user', 'password')"
                                class="btn btn-outline-secondary text-start">
                                <i class="bi bi-tools me-2"></i> <strong>Section User</strong> (Public Works)
                            </button>
                            <button onclick="fillLogin('office_admin', 'password')"
                                class="btn btn-outline-secondary text-start">
                                <i class="bi bi-building me-2"></i> <strong>Office Admin</strong> (Manager)
                            </button>
                            <button onclick="fillLogin('spokesperson', 'password')"
                                class="btn btn-outline-secondary text-start">
                                <i class="bi bi-megaphone me-2"></i> <strong>Spokesperson</strong> (Public Relations)
                            </button>
                            <button onclick="fillLogin('admin', 'admin123')" class="btn btn-outline-danger text-start">
                                <i class="bi bi-shield-lock me-2"></i> <strong>Super Admin</strong> (System Owner)
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function fillLogin(username, password) {
        document.getElementById('id_username').value = username;
        document.getElementById('id_password').value = password;
        // Optional: Auto submit
        // document.getElementById('loginForm').submit();
    }
</script>
{% endblock %}
