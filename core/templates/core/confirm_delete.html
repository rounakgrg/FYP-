{% extends 'core/base.html' %}

{% block content %}
<div class="theme-super-admin">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-body p-4 text-center">
                        <div class="mb-4 text-danger">
                            <i class="bi bi-exclamation-triangle display-1"></i>
                        </div>
                        <h4 class="mb-3 fw-bold">{{ title }}</h4>
                        <p class="text-muted mb-4">Are you sure you want to delete "<strong>{{ object }}</strong>"? This
                            action cannot be undone.</p>

                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex gap-2 justify-content-center">
                                <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                                <a href="javascript:history.back()" class="btn btn-light px-4">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.body.classList.add('theme-super-admin');
</script>
{% endblock %}
