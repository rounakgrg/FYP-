{% extends 'core/base.html' %}

{% block title %}Password Reset Complete | CityConnect{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5 text-center">
                    <div class="bg-success bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-4 fade-in-up" style="width: 100px; height: 100px; animation-duration: 0.8s;">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                    </div>
                    
                    <h3 class="fw-bold mb-3 text-dark">Password Updated</h3>
                    
                    <p class="text-muted mb-4 fs-6">
                        Your password has been successfully reset. You can now log in with your new credentials.
                    </p>
                    
                    <div class="d-grid mt-4">
                        <a href="{% url 'login' %}" class="btn btn-primary btn-lg rounded-pill fw-medium shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Log in to your account
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up {
        animation: fadeInUp ease-out forwards;
    }
</style>
{% endblock %}
